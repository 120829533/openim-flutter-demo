server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: openim-java-service

  # ===== MySQL 数据源 =====
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:openim-mysql-service}:3306/${MYSQL_DATABASE:openim}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:openim}
    password: ${MYSQL_PASSWORD:openim123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: none  # 不自动建表，由 SQL 脚本维护
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:openim-redis-service}
      port: 6379
      password: ${REDIS_PASSWORD:openim123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

# ===== 自定义配置 =====
openim:
  websocket:
    path: ${JAVA_WEBSOCKET_PATH:/ws}
  file-service:
    url: ${FILE_SERVICE_URL:http://openim-file-service:8083}
  python-service:
    url: ${PYTHON_SERVICE_URL:http://openim-python-service:8081}
  redis:
    # 在线状态 TTL（秒）
    online-ttl: 60
    # 消息缓存上限
    msg-cache-limit: 200
    # 分布式锁 TTL（秒）
    lock-ttl: 10

# ===== 日志 =====
logging:
  level:
    root: INFO
    com.openim: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
