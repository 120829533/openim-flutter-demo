# Redis 配置
bind 0.0.0.0
protected-mode no
port 6379

# 认证
requirepass openim123

# 持久化：AOF + RDB
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# 内存策略
maxmemory 512mb
maxmemory-policy allkeys-lru

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128

# 通知（键空间事件，用于过期监听等）
notify-keyspace-events Ex
