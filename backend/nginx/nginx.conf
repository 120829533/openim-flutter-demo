# OpenIM 后端 Nginx 反向代理配置
# 对外暴露 80/443，内部容器走内网通信
# HTTPS/WSS：将 listen 80 改为 listen 443 ssl 并配置证书即可

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 上游服务
    upstream python_backend {
        server openim-python-service:8081;
    }
    upstream java_backend {
        server openim-java-service:8082;
    }
    upstream file_backend {
        server openim-file-service:8083;
    }

    server {
        listen 80;
        server_name _;

        # 文件服务：上传/下载
        location /file/ {
            proxy_pass http://file_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 200m;
        }

        # WebSocket 长连接（Java 服务）
        location /ws {
            proxy_pass http://java_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Java 消息服务 API
        location /api/message/ {
            proxy_pass http://java_backend/api/message/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Python 业务服务 API（默认路由）
        location / {
            proxy_pass http://python_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # HTTPS 示例（需挂载证书后启用）
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     # ... 同上 location 配置
    # }
}
