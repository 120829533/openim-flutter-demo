# OpenIM 后端服务编排
# 容器命名规范：openim-<组件>-service
# 启动：docker compose --env-file .env up -d
# 重建单个服务：docker compose --env-file .env up -d --build openim-python-service

name: openim-backend

services:
  # ========== 容器一：MySQL（数据持久化） ==========
  openim-mysql-service:
    image: mysql:8.0
    container_name: openim-mysql-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=1000
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    networks:
      - openim-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== 容器二：Redis（内存缓存与计数） ==========
  openim-redis-service:
    image: redis:7-alpine
    container_name: openim-redis-service
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - openim-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== 容器三：MinIO（对象存储） ==========
  openim-minio-service:
    image: minio/minio:latest
    container_name: openim-minio-service
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks:
      - openim-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ========== 容器六：文件服务（先启动，Python/Java 依赖它处理文件） ==========
  openim-file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    container_name: openim-file-service
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${FILE_SERVICE_PORT}:8083"
    depends_on:
      openim-minio-service:
        condition: service_healthy
      openim-redis-service:
        condition: service_healthy
    networks:
      - openim-net

  # ========== 容器四：Python 服务（业务逻辑） ==========
  openim-python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: openim-python-service
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILE_SERVICE_URL: http://${FILE_SERVICE_HOST}:8083
      JAVA_SERVICE_URL: http://${JAVA_SERVICE_HOST}:8082
    ports:
      - "${PYTHON_SERVICE_PORT}:8081"
    depends_on:
      openim-mysql-service:
        condition: service_healthy
      openim-redis-service:
        condition: service_healthy
      openim-file-service:
        condition: service_started
    networks:
      - openim-net

  # ========== 容器五：Java 服务（消息核心 + 长连接网关） ==========
  openim-java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
    container_name: openim-java-service
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILE_SERVICE_URL: http://${FILE_SERVICE_HOST}:8083
      PYTHON_SERVICE_URL: http://${PYTHON_SERVICE_HOST}:8081
    ports:
      - "${JAVA_SERVICE_PORT}:8082"
    depends_on:
      openim-mysql-service:
        condition: service_healthy
      openim-redis-service:
        condition: service_healthy
    networks:
      - openim-net

  # ========== Nginx 反向代理（HTTPS/WSS 接入层，基础设施） ==========
  openim-nginx-service:
    image: nginx:alpine
    container_name: openim-nginx-service
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 如需 HTTPS，挂载证书目录：
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - openim-python-service
      - openim-java-service
      - openim-file-service
    networks:
      - openim-net

networks:
  openim-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
